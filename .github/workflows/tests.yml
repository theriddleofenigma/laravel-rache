name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # Prove the declared floors are actually installable.
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            dependency-version: prefer-lowest
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            dependency-version: prefer-lowest
        exclude:
          # Laravel 13 requires PHP ^8.3.
          - php: '8.2'
            laravel: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --${{ matrix.dependency-version }} \
            --prefer-dist --no-interaction --no-progress

      - name: Report installed versions
        run: composer show laravel/framework orchestra/testbench phpunit/phpunit | grep -E '^(name|versions)'

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Validate composer.json
        run: composer validate --strict
