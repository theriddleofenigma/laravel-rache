version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'composer'
    # The whole point of the constraints in composer.json is to span several
    # Laravel majors, so bumping the floor must be a deliberate decision.
    ignore:
      - dependency-name: 'illuminate/*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'orchestra/testbench'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'
